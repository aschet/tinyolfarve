[env:native]
platform = native
test_framework = unity
test_build_src = yes

; Compile-only: verifies the real Arduino AVR toolchain and framework accept
; the library (this is what caught the C++11/constexpr incompatibility).
; No hardware attached in CI, so tests build but are not uploaded or run.
[env:uno]
platform = atmelavr
board = uno
framework = arduino
test_framework = unity
test_build_src = yes
